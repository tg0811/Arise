# Run from this folder: docker compose up -d --build
# The host's nginx (deploy/nginx-arise.conf) terminates HTTPS and proxies to the app on localhost only.
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      TZ: UTC
      # Only used when the database has no password yet (first start). Change it in Settings afterwards.
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:-}
    ports:
      - "127.0.0.1:8787:8787" # not reachable from outside; nginx is the only way in
    volumes:
      - ./data:/data
