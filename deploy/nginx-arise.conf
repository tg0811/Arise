# Arise site for the host's nginx. Install (see docs/DEPLOY.md):
#   sudo cp nginx-arise.conf /etc/nginx/sites-available/arise
#   sudo ln -s /etc/nginx/sites-available/arise /etc/nginx/sites-enabled/arise
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d 89-167-82-104.sslip.io --redirect
# certbot then adds the HTTPS (443) block and the HTTP -> HTTPS redirect to this file by itself.
server {
    listen 80;
    listen [::]:80;
    server_name 89-167-82-104.sslip.io;

    client_max_body_size 20m; # backup restore and avatar uploads

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
